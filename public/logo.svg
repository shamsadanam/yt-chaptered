<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d5c46" />
      <stop offset="100%" stop-color="#083e2f" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Full bleed background: zero margin, zero whitespace -->
  <rect width="128" height="128" fill="url(#bgGrad)" />
  <rect width="128" height="64" fill="url(#glowGrad)" />

  <!-- Subtle inner rim for depth -->
  <rect x="0.5" y="0.5" width="127" height="127" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />

  <!-- Chapter bookmark tracks (top and bottom) in sage tint -->
  <rect x="24" y="20" width="80" height="9" rx="4.5" fill="#10b981" fill-opacity="0.5" />
  <rect x="24" y="99" width="80" height="9" rx="4.5" fill="#10b981" fill-opacity="0.5" />

  <!-- Central Play + Chapter Bookmark Icon -->
  <path
    d="M48 38
       C48 35.5 50.8 33.9 53.0 35.2
       L89.5 59.7
       C91.5 61.0 91.5 64.0 89.5 65.3
       L53.0 89.8
       C50.8 91.1 48 89.5 48 87.0
       Z"
    fill="#ffffff"
  />

  <!-- Distinct chapter notches / segmentation lines inside play button in Nordic Emerald -->
  <line x1="61" y1="45" x2="61" y2="80" stroke="#0d5c46" stroke-width="3.5" stroke-linecap="round" />
  <line x1="74" y1="53" x2="74" y2="72" stroke="#0d5c46" stroke-width="3.5" stroke-linecap="round" />
</svg>
