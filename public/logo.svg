<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d5c46" />
      <stop offset="100%" stop-color="#083e2f" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d5c46" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" filter="url(#subtleShadow)" />
  <rect x="4" y="4" width="120" height="60" rx="30" fill="url(#glowGrad)" />

  <!-- Inner subtle border -->
  <rect x="5" y="5" width="118" height="118" rx="29" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />

  <!-- Chapter bookmarks / tracks stacked behind in sage tint -->
  <!-- Track 1 (top chapter pill) -->
  <rect x="28" y="24" width="72" height="8" rx="4" fill="#10b981" fill-opacity="0.45" />
  
  <!-- Track 2 (bottom chapter pill) -->
  <rect x="28" y="96" width="72" height="8" rx="4" fill="#10b981" fill-opacity="0.45" />

  <!-- Central Play + Chapter Bookmark Icon -->
  <path
    d="M48 40.5
       C48 37.8 51.0 36.1 53.4 37.5
       L89.2 60.5
       C91.4 61.9 91.4 65.1 89.2 66.5
       L53.4 89.5
       C51.0 90.9 48 89.2 48 86.5
       Z"
    fill="#ffffff"
  />

  <!-- Distinct chapter notches / segmentation lines inside play button in Nordic Emerald -->
  <line x1="61" y1="47" x2="61" y2="80" stroke="#0d5c46" stroke-width="3" stroke-linecap="round" />
  <line x1="74" y1="54" x2="74" y2="73" stroke="#0d5c46" stroke-width="3" stroke-linecap="round" />
</svg>
